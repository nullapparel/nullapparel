<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Null Streetwear // Defined by Nothing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="script,js" href="scrip.js">
    <link rel="shop.html" href="shop.html">
    <link rel="about.html" href="about.html">
    <link rel="contact.html" href="contact.html">
    <link rel="cart.html" href="cart.html">
    <link rel="home.html" href="home.html">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-left">
            <img src="img-wrapper/logo.png" alt="Null Logo" class="brand-logo">
        </div>

        <nav class="nav-menu">
            <a href="#" class="active">HOME</a>
            <a href="shop.html">SHOP</a>
            <a href="about.html">ABOUT</a>
            <a href="contact.html">CONTACT</a>
            <a href="cart.html">CART</a>
        </nav>

        

        <div class="nav-icons">
            <button class="icon-btn" aria-label="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button class="icon-btn" aria-label="Account">
                <a href="profile.html" class="icon-btn"></a>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </button>
            <button class="icon-btn cart-btn" aria-label="Cart">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                <span class="cart-count">0</span>
            </button>
        </div>   
    </header>

    <!-- Main Hero Container -->
    <main class="hero-container">
        
        <!-- Full Screen Background Image -->
        <div class="hero-bg-wrapper">
            <img src="img-wrapper/homepage.jpg" alt="NULL Hero Model" class="hero-main-img">
            <div class="hero-overlay"></div>
        </div>

        <!-- Left Text Area -->
        <div class="hero-text-content">
            <p class="brand-subtitle">NULL APPAREL</p>
            <h1 class="hero-heading">DEFINED BY<br><h1>
                <h1><span class="highlight-text">NOTHING</span></h1>
            <p class="hero-description">
                Not a trend. Not a label.<br>
                Just a feeling. <strong>Null.</strong>
            </p>

            <a href="https://nullapparel.github.io/null-verify/?id=EX01" class="shop-btn">
                <span>SHOP NOW</span>
                <span class="arrow">→</span>
            </a>
        </div>

        <!-- Right Thumbnails -->
        <div class="right-thumbnails">
            <div class="thumb-card active">
                <img src="img-wrapper/boy1.png" alt="Thumb 1">   
            </div>
            <div class="thumb-card">
                <img src="img-wrapper/boy2.png" alt="Thumb 2">
            </div>
            <div class="thumb-card">
                <img src="img-wrapper/logo.png" alt="Thumb 3">
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="hero-bottom-bar">
            <div class="bottom-left-text">
                <span class="line"></span>
                <span>URBAN APPAREL CO.</span>
            </div>

            <div class="bottom-slider-ctrl">
                <button class="arrow-btn">←</button>
                <span class="slide-num">01 / 03</span>
                <button class="arrow-btn">→</button>
            </div>
        </div>

    </main>

    

</body>
</html>
